name = "ecommerce-app"
main = "worker/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built React app from /dist
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 Database — replace database_id after `wrangler d1 create ecommerce-db`
[[d1_databases]]
binding = "DB"
database_name = "ecommerce-db"
database_id = "678bdd8b-bd57-4197-a11a-7cd4443517d4"

[vars]
JWT_SECRET = "change-this-to-super-secret-key"
